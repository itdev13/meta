# /etc/nginx/sites-available/whatsappapi  (then: ln -s ../sites-available/whatsappapi /etc/nginx/sites-enabled/)
# TLS via: sudo certbot --nginx -d whatsappapi.vaultsuite.store
server {
  listen 80;
  server_name whatsappapi.vaultsuite.store;

  client_max_body_size 5m;

  # Live QR / status stream (Server-Sent Events): never buffer, keep the connection open.
  location /api/live {
    proxy_pass http://127.0.0.1:3025;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:3025;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
